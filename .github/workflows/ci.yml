name: CollectionManager CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label with Xcode 27.1 installed (hosted image currently lacks it)'
        required: false
        default: macos-26

jobs:
  clean-clone-build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Verify documented toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | rg '^Xcode 27\.1$'
      - name: Verify no sibling package or generated build is required
        run: |
          test ! -e ../SFSymbolSelector
          test "$(git ls-files build | wc -l | tr -d ' ')" = "0"
          ! rg -n 'SFSymbolSelector|\.\./SFSymbolSelector' CollectionManager.xcodeproj CollectionManager
      - name: Build macOS Release
        run: xcodebuild -project CollectionManager.xcodeproj -scheme CollectionManager -configuration Release -sdk macosx -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/CollectionManager-macOS" CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS Release-compatible configuration
        run: xcodebuild -project CollectionManager.xcodeproj -scheme CollectionManager -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/CollectionManager-iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Validate project and test sources
        run: |
          xcodebuild -list -project CollectionManager.xcodeproj
      - name: Run unit tests
        run: xcodebuild test -project CollectionManager.xcodeproj -scheme CollectionManager -configuration Debug -sdk macosx -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/CollectionManager-tests" CODE_SIGNING_ALLOWED=NO -only-testing:CollectionManagerTests
      - name: Run isolated UI smoke tests
        run: xcodebuild test -project CollectionManager.xcodeproj -scheme CollectionManager -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/CollectionManager-tests" -only-testing:CollectionManagerUITests CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS= DEVELOPMENT_TEAM=
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/CollectionManager-tests/Logs/Test/*.xcresult
